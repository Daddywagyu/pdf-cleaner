name: Build Windows Setup

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Validate source files
        shell: pwsh
        run: |
          if (!(Test-Path main.py) -or !(Test-Path requirements.txt)) {
            Write-Error "PDF Cleaner source files are missing. Extract local_pdf_pen_remover.zip into the repository root so main.py and requirements.txt are at the root."
          }
          if (!(Test-Path installer.iss)) {
            Write-Error "installer.iss is missing."
          }

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: pytest -v

      - name: Build application with PyInstaller
        run: >
          pyinstaller --noconfirm --clean --windowed
          --name LocalPDFPenRemover
          --collect-submodules PySide6
          --exclude-module PySide6.QtWebEngineCore
          --exclude-module PySide6.QtWebEngineWidgets
          --exclude-module PySide6.QtPdf
          --exclude-module PySide6.QtQuick
          --exclude-module PySide6.QtQml
          main.py

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (!(Test-Path $iscc)) { $iscc = "$env:ProgramFiles\Inno Setup 6\ISCC.exe" }
          if (!(Test-Path $iscc)) { throw "Inno Setup compiler not found." }
          & $iscc installer.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (!(Test-Path "Output\LocalPDFPenRemover-Setup.exe")) {
            throw "Setup.exe was not produced."
          }

      - name: Upload build artifact
        if: startsWith(github.ref, 'refs/tags/') == false
        uses: actions/upload-artifact@v4
        with:
          name: LocalPDFPenRemover-Windows-Setup
          path: Output/LocalPDFPenRemover-Setup.exe
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: Output/LocalPDFPenRemover-Setup.exe
          generate_release_notes: true
